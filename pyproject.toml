[project]
name = "FedGWAS"
version = "0.0.1"
description = "Federated genome-wide association study pipeline built with Flower and PLINK"
authors = [{name = "idsla"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["federated-learning", "gwas", "bioinformatics", "flower", "plink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=2.2.2",
    "scipy>=1.9.0",
    "mkdocs>=1.6.1",
    "flwr[simulation]>=1.19.0,<1.20",
    "pysnptools>=0.5.13",
    "pandas-plink>=2.3.1",
    "pyplink>=1.3.7",
    "phe>=1.5.0",
    "pycryptodomex>=3.19.0",
    "PyYAML>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "quarto-cli>=1.9.38",
    "matplotlib>=3.10.9",
]

[project.scripts]
fedgwas-sim = "pipeline.cli.sim:app"
fedgwas-deploy = "pipeline.cli.deploy:app"

[project.urls]
Homepage = "https://github.com/idsla/Fed-GWAS"
Repository = "https://github.com/idsla/Fed-GWAS"
Issues = "https://github.com/idsla/Fed-GWAS/issues"
Documentation = "https://idsla.github.io/Fed-GWAS/"

[project.optional-dependencies]
dev = [
    "flake8>=7.1.0",
    "pytest>=8.2.2",
    "isort>=5.13.2",
    "flake8-docstrings>=1.7.0",
    "pre-commit>=3.7.1",
    "mypy>=1.10.1",
    "pylint>=3.2.5",
    "tox>=4.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.flwr.app]
publisher = "idsla"

[tool.flwr.app.components]
serverapp = "pipeline.server_app:app"
clientapp = "pipeline.client_app:app"

[tool.flwr.app.config]
simulation = true
num-server-rounds = 3
default-partition-by = "samples"
config_path = "experiments/correctness/tiny_even/configs"
phenotype_fix_missing_to_case = false

[tool.flwr.federations]
default = "local-simulation"
options.num-supernodes = 2

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
options.num-supernodes = 2

# Cluster deployment (server + 2 clients on separate nodes)
# Update the address to your server node Exec API (default 9093).
# Example placeholder: server at 192.168.1.88
[tool.flwr.federations.cluster-deployment]
address = "192.168.1.88:9093"
insecure = true
options.num-supernodes = 2
