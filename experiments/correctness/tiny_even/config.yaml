# Correctness Experiment: Tiny Scale, Even Partition
# Purpose: Verify federated results match centralized PLINK (baseline validation)
# Expected Runtime: 5-10 minutes

clients:
  config_files:
    0: experiments/correctness/tiny_even/configs/center_1/config.yaml
    1: experiments/correctness/tiny_even/configs/center_2/config.yaml
  participation:
    global_qc: true
    global_qc_response: true
    init_chunks: true
    init_chunks_lr: true
    iterative_king: true
    iterative_lr: true
    key_exchange: true
    local_lr: true
    local_lr_filter_response: true
    local_qc: true
    sync: true
  thresholds:
    hwe_threshold: 1.0e-06
    maf_threshold: 0.01
    missing_threshold: 0.05
    p_threshold: 0.3
    king_threshold: 0.23

data:
  data_dir: experiments/correctness/tiny_even/data/tiny
  partition_strategy: even
  scale: tiny

description: 'Correctness validation: Tiny scale with even partition (2 clients)'
experiment_name: tiny_even
experiment_category: correctness

monitoring:
  enable_network_monitoring: true
  enable_performance_monitoring: true
  network_monitoring_interval: 5.0
  resource_monitoring_interval: 2.0
  network_max_samples: 500

# Product retention: minimal | standard | research
retention:
  tier: standard
  auto_apply_on_complete: true

num_clients: 2
scenario: correctness_tiny

server:
  chunk_size: 200
  min_available_clients: 1
  min_fit_clients: 1
  num_server_rounds: 50

# Analysis settings
analysis:
  generate_baseline: true
  compare_results: true
  metrics_collection: true

