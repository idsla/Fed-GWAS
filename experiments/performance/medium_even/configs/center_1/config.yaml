input_data:
  path: "experiments/performance/medium_even/data/medium/center_1/medium_center_1"
  type: "bed"

output:
  intermediate_dir: "experiments/performance/medium_even/results/center_1/intermediate"
  log_dir: "experiments/performance/medium_even/results/center_1/logs"

parameters:
  sample_offset: 1000000000000
  chunk_size: 1000
  sample_chunk_size: 500
  snp_chunk_size: 500  # 50k SNPs -> 100 KING chunks per client
  lr_target_chunks: 5
  run_id: "20260523_1200"

thresholds:
  maf_threshold: 0.01
  missing_threshold: 0.05
  hwe_threshold: 1e-6
  p_threshold: 0.3
  local_lr_threshold: 0.3
  global_lr_threshold: 0.1
  king_threshold: 0.23

flower:
  server_address: "127.0.0.1:9092"
  num_rounds: 130

participation:
  key_exchange: true
  sync: true
  local_qc: true
  global_qc: true
  global_qc_response: true
  init_chunks: true
  iterative_king: true
  local_lr: true
  local_lr_filter_response: true
  init_chunks_lr: true
  iterative_lr: true
