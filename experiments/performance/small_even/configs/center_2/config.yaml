input_data:
  path: "experiments/performance/small_even/data/small/center_2/small_center_2"
  type: "bed"

output:
  intermediate_dir: "experiments/performance/small_even/results/center_2/intermediate"
  log_dir: "experiments/performance/small_even/results/center_2/logs"

parameters:
  sample_offset: 2000000000000
  chunk_size: 500
  sample_chunk_size: 200
  snp_chunk_size: 500
  lr_target_chunks: 4
  run_id: "20260523_1200"

thresholds:
  maf_threshold: 0.01
  missing_threshold: 0.05
  hwe_threshold: 1e-6
  p_threshold: 0.3
  local_lr_threshold: 0.3
  global_lr_threshold: 0.1
  king_threshold: 0.23

flower:
  # For local simulation use 127.0.0.1:9092
  # For cluster deployment use the matpool server node IP.
  server_address: "127.0.0.1:9092"
  num_rounds: 80

participation:
  key_exchange: true
  sync: true
  local_qc: true
  global_qc: true
  global_qc_response: true
  init_chunks: true
  iterative_king: true
  local_lr: true
  local_lr_filter_response: true
  init_chunks_lr: true
  iterative_lr: true
